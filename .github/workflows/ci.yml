# GitHub-hosted runners only. Never add a self-hosted runner to this public repo: a pull request
# from a fork would run its code on that machine.
# Jobs run only in the public repository; a private mirror runs its own workflow instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  test:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -count=1 -race -timeout 5m -coverprofile=coverage.out ./...

      - name: coverage check
        run: |
          # Safety-critical packages: 60% floor. internal/apply is excluded
          # because its hot paths (setxattr, NFSv4 ACL encode/decode over NFS)
          # need a real mount and cannot run in CI (41% offline).
          threshold=60
          fail=0
          for pkg in internal/checkpoint internal/nfs4acl internal/spec internal/walk internal/run internal/speccapture; do
            pct=$(go test -coverprofile=/dev/null -covermode=atomic "./${pkg}" 2>&1 | grep -oP 'coverage: \K[0-9.]+')
            if [ -z "$pct" ]; then
              echo "WARNING: no coverage data for $pkg"
              continue
            fi
            echo "$pkg: ${pct}%"
            if awk "BEGIN{exit !($pct < $threshold)}"; then
              echo "FAIL: $pkg coverage ${pct}% is below ${threshold}% minimum"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All safety-critical packages above ${threshold}% coverage threshold."

  test-macos:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -count=1 -race -timeout 5m ./...

  # permissionreset-smb (smb/): builds the .NET solution and runs its unit tests on a hosted
  # Windows runner, the platform the tool ships for. Hardware qualification is maintainer-run.
  smb-windows:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: smb/global.json

      - name: build
        run: dotnet build smb/PermissionResetSmb.sln -c Release --nologo

      - name: test
        run: dotnet test smb/PermissionResetSmb.sln -c Release --nologo --no-build

      # Packs the release archive exactly as release-smb.yml does and smoke-checks it extracted
      # (version, and plan on both golden plans), so a packaging break shows up on the pull
      # request rather than at tag time. Nothing is published.
      - name: pack and smoke-check
        shell: pwsh
        run: smb/release/pack.ps1 -OutDir dist-smb

  # Set-SaclOnly's Pester suite under Windows PowerShell 5.1 and PowerShell 7 (decision record
  # docs/decision-flasharray-smb-20261107.md, section 7). Its GoGlob and rule tests read the shared
  # Go-generated vectors that permissionreset-smb also tests against, so drift between the
  # script's matching and Go's shows up here. The hosted runner is elevated, so the tree tests
  # (SACL writes on local NTFS under the Pester test drive) run too, and build-spec.exe is built
  # for the -Spec end-to-end test. A skipped test fails the job: a skip here would mean a check
  # silently stopped running.
  saclonly-pester:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # plan-golden.json is a copy of build-spec's golden plan; the Pester plan tests read the copy.
      - name: golden plan copy matches build-spec
        run: |
          $a = [IO.File]::ReadAllBytes('tools/set-saclonly/testdata/plan-golden.json')
          $b = [IO.File]::ReadAllBytes('cmd/build_spec/testdata/saclplan.golden.json')
          if ([Convert]::ToBase64String($a) -ne [Convert]::ToBase64String($b)) {
            throw 'tools/set-saclonly/testdata/plan-golden.json differs from cmd/build_spec/testdata/saclplan.golden.json; copy it again'
          }

      - name: build build-spec.exe
        run: |
          $env:CGO_ENABLED = '0'
          go build -o "$env:RUNNER_TEMP\build-spec.exe" ./cmd/build_spec/
          if ($LASTEXITCODE -ne 0) { throw "go build exited $LASTEXITCODE" }

      # Windows PowerShell 5.1 ships Pester 3.4; the suite needs 5. Pinned so a Pester release
      # cannot change the result.
      - name: install Pester
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester
        env:
          SACLONLY_BUILD_SPEC: ${{ runner.temp }}\build-spec.exe
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $PSVersionTable.PSVersion
          $c = New-PesterConfiguration
          $c.Run.Path = 'tools/set-saclonly'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c
          if ($r.Result -ne 'Passed') { throw "Pester: $($r.FailedCount) failed" }
          if ($r.SkippedCount -ne 0) { throw "Pester: $($r.SkippedCount) skipped; the tree and -Spec tests must run here" }
          if ($r.PassedCount -eq 0) { throw 'Pester: no tests ran' }

  # Builds the release archives exactly as the release workflow does and smoke-checks them, so a
  # packaging break shows up on the pull request rather than at tag time. Nothing is published.
  release-smoke:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build and pack
        run: make release VERSION=v0.0.0-ci && make release-archive

      - name: smoke-check archives
        run: tools/release/smoke.sh dist v0.0.0-ci

  # Fails when a tracked file names an internal host, address, domain or person. The denylist itself
  # names those, so it is not in the repo: it arrives as the PUBLIC_SCAN_DENYLIST secret, which
  # GitHub does not pass to pull requests from forks. Those skip with a notice and are checked again
  # on the push to main. Any other run without the secret fails: a skip there would pass unscanned.
  public-scan:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: scan
        env:
          DENYLIST: ${{ secrets.PUBLIC_SCAN_DENYLIST }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$DENYLIST" ]; then
            if [ "$FROM_FORK" = true ]; then
              echo "::notice::PUBLIC_SCAN_DENYLIST is not passed to pull requests from forks; scan skipped until the push to main"
              exit 0
            fi
            echo "::error::PUBLIC_SCAN_DENYLIST is not set; the public scan cannot run"
            exit 1
          fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          tools/public-scan/scan.sh --denylist "$RUNNER_TEMP/denylist.txt"

  # Fails when a commit carries a Committed-From trailer (hostname, OS/arch and local IP, appended by
  # a local commit hook). Needs no secret, so it also runs on pull requests from forks. On a pull
  # request it checks the branch's commits; on a push to main, the pushed range. GitHub's
  # squash-merge copies branch trailers into the squash body, so the pull request check is the one
  # that keeps them off main.
  commit-trailers:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: reject Committed-From trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          hits=$(git log --format='%h %s%n%B' "$range" | awk '/^[0-9a-f]+ /{c=$0} /^Committed-From[:]/{print c}')
          if [ -n "$hits" ]; then
            echo "::error::Committed-From trailers found; strip them and set core.hooksPath for the clone that made them"
            echo "$hits"
            exit 1
          fi
          echo "no Committed-From trailers in $range"

  vulncheck:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (see above)"
        continue-on-error: true

  build:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      # The test-macos job executes the darwin build; this step type-checks the
      # other targets. go vet rather than only go build because vet type-checks
      # _test.go files, and a good deal of this program's platform-dependent
      # code lives in tests.
      - name: cross-compile and vet
        run: |
          set -euo pipefail
          for target in linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "=== ${target} ==="
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o /dev/null ./cmd/permissionreset/
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o /dev/null ./cmd/generate_tree/
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o /dev/null ./cmd/sweep/
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -o /dev/null ./cmd/build_spec/
            GOOS="$goos" GOARCH="$goarch" go vet ./...
          done

          # build-spec is the only command that compiles on Windows today;
          # walk and apply use syscall.Stat_t which has no Windows equivalent.
          echo "=== windows/amd64 (build-spec only) ==="
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/build_spec/

      - name: smoke test - permissionreset
        run: |
          ./permissionreset -version
          ./permissionreset -help || true
          # Dry-run on a temp tree: builds a small tree, runs without --apply (default dry-run).
          tmp=$(mktemp -d)
          mkdir -p "$tmp/sub"
          touch "$tmp/sub/file.txt"
          cat > "$tmp/spec.yaml" <<'SPEC'
          protocol: posix
          default:
            mode: "0755"
          rules:
            - match:
                type: directory
              mode: "0755"
            - match:
                type: file
              mode: "0644"
          SPEC
          ./permissionreset -spec "$tmp/spec.yaml" "$tmp"
          rm -rf "$tmp"

      - name: smoke test - sweep
        run: |
          ./sweep -version
          ./sweep -help || true

      - name: smoke test - build-spec
        run: |
          ./build-spec -version
          ./build-spec -help || true

      - name: build-spec dependency guard
        run: make build-spec-depguard

      - name: smoke test - generate-tree
        run: |
          ./generate-tree -help || true

  gui-module:
    if: github.repository == 'PureStorage-OpenConnect/permissionreset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/buildspec/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            gui/buildspec/go.sum

      # Ubuntu 24.04 ships WebKitGTK 4.1 only; Wails selects it with the webkit2_41 tag.
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: vet
        working-directory: gui/buildspec
        run: go vet -tags webkit2_41 ./...

      - name: test
        working-directory: gui/buildspec
        run: go test -tags webkit2_41 -count=1 -race -timeout 5m ./...
