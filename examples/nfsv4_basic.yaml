# DEMONSTRATION ONLY -- not a policy to apply to real data.
# It grants EVERYONE@ read access to every file and directory, and GROUP@ full control of every
# directory, and it replaces whatever ACL each object had. Capture your own spec with build-spec
# from approved templates, or write one with docs/spec-guide.md.
#
# NFSv4 ACL using only special principals (works on any FlashBlade)
# Directories get inheritable ACEs, files get non-inheritable
protocol: nfsv4

default:
  acl:
    - "A::OWNER@:rwaDxtTcCoy"
    - "A:g:GROUP@:rxtncy"
    - "A::EVERYONE@:rxtncy"

rules:
  - match:
      type: directory
    acl:
      - "A:fd:OWNER@:rwaDxtTcCoy"
      - "A:fdg:GROUP@:rwaDxtTcCoy"
      - "A:fd:EVERYONE@:rxtncy"

  - match:
      type: file
      pattern: "*.sh"
    acl:
      - "A::OWNER@:rwaxTcCoy"
      - "A:g:GROUP@:rxncy"
      - "A::EVERYONE@:rxncy"

  - match:
      type: file
    acl:
      - "A::OWNER@:rwaTcCoy"
      - "A:g:GROUP@:rncy"
      - "A::EVERYONE@:rncy"
