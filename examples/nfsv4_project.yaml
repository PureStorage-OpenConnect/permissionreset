# Example: NFSv4 ACL for a shared project directory
# Directories get inheritable ACEs, files get non-inheritable
protocol: nfsv4

default:
  acl:
    - "A::OWNER@:rwaDxtTcCoy"
    - "A:g:GROUP@:rxtncy"
    - "A::EVERYONE@:rxtncy"

rules:
  - match:
      type: directory
    acl:
      - "A:fd:OWNER@:rwaDxtTcCoy"
      - "A:fdg:engineering@example.com:rwaDxtTcCoy"
      - "A:fdg:GROUP@:rxtncy"
      - "A:fd:EVERYONE@:rxtncy"

  - match:
      type: file
      pattern: "*.sh"
    acl:
      - "A::OWNER@:rwaxTcCoy"
      - "A:g:engineering@example.com:rwaxncy"
      - "A:g:GROUP@:rxncy"
      - "A::EVERYONE@:rxncy"

  - match:
      type: file
    acl:
      - "A::OWNER@:rwaTcCoy"
      - "A:g:engineering@example.com:rwncy"
      - "A:g:GROUP@:rncy"
      - "A::EVERYONE@:rncy"
