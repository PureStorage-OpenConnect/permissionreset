# Golden input for TestRunSmbPlanGolden: the sacl: shapes permissionreset-smb
# has to tell apart -- absent, empty and listed -- which move the plan to
# schema 3 (smb/DESIGN-sacl-write.md, 2.1). A DACL-only spec stays schema 2;
# testdata/smbplan-dacl.yaml covers that.
protocol: nfsv4
exclude:
  - .snapshot
  - ./logs/*.gz
default:
  acl:
    - "A:fd:EVERYONE@:rxtncy"
    - "A:fdg:smb-admins@example.net:rwaDdxtTnNcCoy"
rules:
  - match: {type: directory, pattern: "audit*"}
    sacl:
      - "U:fdSF:EVERYONE@:rwadDxtTcCoy"
  - match: {type: directory}
    acl:
      - "D:fdg:smb-blocked@example.net:wadD"
      - "A:fd:EVERYONE@:rxtncy"
      - "A:fdg:smb-admins@example.net:rwaDdxtTnNcCoy"
    sacl: []
  - match: {type: file, pattern: "*.db"}
    acl:
      - "A:g:smb-admins@example.net:rwatTnNcCoy"
    owner: smb-owner@example.net
  - match: {type: file}
    acl:
      - "A::EVERYONE@:rtncy"
      - "A:g:smb-admins@example.net:rwaDdxtTnNcCoy"
